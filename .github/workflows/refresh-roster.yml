name: Refresh roster and deploy dashboard
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: roster-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current Sleeper roster
        run: node scripts/refresh-roster.mjs
      - name: Save verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roster.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Sleeper roster'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html app.js styles.css roster.json .nojekyll public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
